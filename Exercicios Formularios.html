
<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Formulário TSI2A</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #dbeafe, #f1f5f9);
    padding: 35px 15px;
    color: #1e293b;
}

.container {
    max-width: 900px;
    margin: auto;
    background: white;
    border-radius: 16px;
    overflow: hidden;
    box-shadow: 0 10px 35px rgba(0,0,0,0.12);
}

header {
    background: linear-gradient(135deg, #1e40af, #2563eb);
    color: white;
    padding: 35px 20px;
    text-align: center;
}

header h1 {
    font-size: 27px;
    margin-bottom: 10px;
}

header p {
    color: #dbeafe;
    font-size: 15px;
}

form {
    padding: 30px;
}

fieldset {
    border: 1px solid #dbe3ee;
    border-radius: 12px;
    padding: 25px;
    margin-bottom: 25px;
}

legend {
    padding: 0 10px;
    font-size: 18px;
    font-weight: bold;
    color: #1d4ed8;
}

.grid {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 20px;
}

.campo {
    display: flex;
    flex-direction: column;
    gap: 8px;
}

.completo {
    grid-column: 1 / -1;
}

label {
    font-size: 14px;
    font-weight: bold;
    color: #334155;
}

input:not([type="radio"]):not([type="file"]),
select {
    width: 100%;
    padding: 12px;
    border: 1px solid #cbd5e1;
    border-radius: 8px;
    background: #f8fafc;
    font-size: 14px;
    transition: 0.3s;
}

input:focus, select:focus {
    outline: none;
    border-color: #2563eb;
    background: white;
    box-shadow: 0 0 0 3px rgba(37,99,235,0.12);
}

input::placeholder {
    color: #94a3b8;
}

.opcoes {
    display: flex;
    gap: 25px;
    padding: 8px 0;
}

.opcoes label {
    display: flex;
    align-items: center;
    gap: 8px;
    font-weight: normal;
    cursor: pointer;
}

input[type="radio"] {
    accent-color: #2563eb;
}

input[type="file"] {
    width: 100%;
    padding: 10px;
    border: 1px dashed #94a3b8;
    border-radius: 8px;
    background: #f8fafc;
}

.botoes {
    display: flex;
    justify-content: flex-end;
    gap: 12px;
    margin-top: 10px;
}

button {
    padding: 13px 25px;
    border: none;
    border-radius: 8px;
    font-size: 15px;
    font-weight: bold;
    cursor: pointer;
    transition: 0.3s;
}

.enviar {
    background: #2563eb;
    color: white;
}

.enviar:hover {
    background: #1d4ed8;
    transform: translateY(-2px);
}

.limpar {
    background: #e2e8f0;
    color: #334155;
}

.limpar:hover {
    background: #cbd5e1;
}

footer {
    padding: 18px;
    text-align: center;
    background: #f8fafc;
    border-top: 1px solid #e2e8f0;
    color: #64748b;
    font-size: 13px;
}

@media (max-width: 650px) {
    body {
        padding: 12px;
    }

    header h1 {
        font-size: 21px;
    }

    form {
        padding: 20px 15px;
    }

    fieldset {
        padding: 20px 15px;
    }

    .grid {
        grid-template-columns: 1fr;
    }

    .completo {
        grid-column: auto;
    }

    .botoes {
        flex-direction: column;
    }

    button {
        width: 100%;
    }
}
</style>
</head>

<body>
<div class="container">

<header>
    <h1>CV4 - Técnico de Suporte Informático</h1>
    <p>Turma TSI2A | Formulário de Registo</p>
</header>

<form action="#" method="post" enctype="multipart/form-data">

<fieldset>
<legend>Dados Pessoais</legend>

<div class="grid">

    <div class="campo">
        <label for="nome">Nome</label>
        <input type="text" id="nome" name="nome"
               placeholder="Digite o seu nome" required>
    </div>

    <div class="campo">
        <label for="apelido">Apelido</label>
        <input type="text" id="apelido" name="apelido"
               placeholder="Digite o seu apelido" required>
    </div>

    <div class="campo">
        <label for="nascimento">Data de Nascimento</label>
        <input type="date" id="nascimento" name="nascimento" required>
    </div>

    <div class="campo">
        <label for="bi">Número do BI</label>
        <input type="text" id="bi" name="bi"
               placeholder="Digite o número do BI">
    </div>

    <div class="campo">
        <label for="contacto">Contacto</label>
        <input type="tel" id="contacto" name="contacto"
               placeholder="Digite o seu contacto">
    </div>

    <div class="campo">
        <label for="naturalidade">Naturalidade</label>
        <input type="text" id="naturalidade" name="naturalidade"
               placeholder="Digite a sua naturalidade">
    </div>

    <div class="campo completo">
        <label>Género</label>
        <div class="opcoes">
            <label><input type="radio" name="genero"
                          value="Masculino"> Masculino</label>
            <label><input type="radio" name="genero"
                          value="Feminino"> Feminino</label>
        </div>
    </div>

    <div class="campo">
        <label for="rg">RG</label>
        <input type="text" id="rg" name="rg"
               placeholder="Digite o seu RG">
    </div>

</div>
</fieldset>

<fieldset>
<legend>Dados de Endereço</legend>

<div class="grid">

    <div class="campo">
        <label for="rua">Rua</label>
        <input type="text" id="rua" name="rua"
               placeholder="Digite a sua rua">
    </div>

    <div class="campo">
        <label for="numero">Número</label>
        <input type="text" id="numero" name="numero"
               placeholder="Digite o seu número">
    </div>

    <div class="campo">
        <label for="bairro">Bairro</label>
        <input type="text" id="bairro" name="bairro"
               placeholder="Digite o seu bairro">
    </div>

    <div class="campo">
        <label for="distrito">Distrito</label>
        <select id="distrito" name="distrito" required>
            <option value="">-- Escolha o distrito --</option>

            <optgroup label="Cidade de Maputo">
                <option value="KaMpfumo">KaMpfumo</option>
                <option value="Nlhamankulu">Nlhamankulu</option>
                <option value="KaMaxaquene">KaMaxaquene</option>
                <option value="KaMavota">KaMavota</option>
                <option value="KaMubukwana">KaMubukwana</option>
                <option value="KaTembe">KaTembe</option>
                <option value="KaNyaka">KaNyaka</option>
            </optgroup>

            <optgroup label="Província de Maputo">
                <option value="Boane">Boane</option>
                <option value="Magude">Magude</option>
                <option value="Manhiça">Manhiça</option>
                <option value="Marracuene">Marracuene</option>
                <option value="Matola">Matola</option>
                <option value="Matutuíne">Matutuíne</option>
                <option value="Moamba">Moamba</option>
                <option value="Namaacha">Namaacha</option>
            </optgroup>
        </select>
    </div>

</div>
</fieldset>

<fieldset>
<legend>Dados de Login</legend>

<div class="grid">

    <div class="campo">
        <label for="email">E-mail</label>
        <input type="email" id="email" name="email"
               placeholder="exemplo@email.com" required>
    </div>

    <div class="campo">
        <label for="imagem">Imagem de Perfil</label>
        <input type="file" id="imagem" name="imagem"
               accept="image/*">
    </div>

    <div class="campo">
        <label for="usuario">Login de Usuário</label>
        <input type="text" id="usuario" name="usuario"
               placeholder="Crie um nome de usuário" required>
    </div>

    <div class="campo">
        <label for="senha">Senha</label>
        <input type="password" id="senha" name="senha"
               placeholder="Digite a sua senha" required>
    </div>

    <div class="campo">
        <label for="confirmar">Confirme a sua Senha</label>
        <input type="password" id="confirmar" name="confirmar"
               placeholder="Confirme a sua senha" required>
    </div>

</div>
</fieldset>

<div class="botoes">
    <button type="reset" class="limpar">Limpar</button>
    <button type="submit" class="enviar">Enviar Formulário</button>
</div>

</form>

<footer>
    CV4 - Técnico de Suporte Informático | TSI2A
</footer>

</div>
</body>
</html>
