<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flame</title>
    <style>
        html, body {
            margin: 0;
            height: 100%;
            background: black;
        }
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        /* cena fixa 300x300 */
        .scene {
            position: relative;
            width: 300px;
            height: 300px;
        }

        /* ===== FOGO ===== */
        .fire {
            position: absolute;
            left: 120px;
            top: 90px;
            width: 60px;
            height: 60px;
            transform-origin: center bottom;
            animation: flicker 0.6s ease-in-out infinite alternate;
            z-index: 1;
        }

        @keyframes flicker {
            0%   { transform: rotate(-1deg) scaleY(1); }
            20%  { transform: rotate(1deg)  scaleY(1.03); }
            40%  { transform: rotate(-1.5deg) scaleY(0.98); }
            60%  { transform: rotate(1deg)  scaleY(1.05); }
            80%  { transform: rotate(-2deg) scaleY(0.93); }
            100% { transform: rotate(1.5deg) scaleY(1.02); }
        }

        /* pulsação individual de cada camada */
        @keyframes pulse {
            0%   { transform: rotate(-45deg) scale(1.5, 1.5); }
            50%  { transform: rotate(-45deg) scale(1.6, 1.75); }
            100% { transform: rotate(-45deg) scale(1.45, 1.6); }
        }

        .flame {
            position: absolute;
            bottom: 0;
            border-bottom-right-radius: 50%;
            border-bottom-left-radius: 50%;
            border-top-left-radius: 50%;
            transform: rotate(-45deg) scale(1.5, 1.5);
            animation: pulse 0.5s ease-in-out infinite alternate;
        }

        .red {
            left: 5px;
            width: 50px;
            height: 50px;
            background: orangered;
            box-shadow: 0 0 5px 4px orangered;
            animation-duration: 0.7s;
        }
        .orange {
            left: 10px;
            width: 40px;
            height: 40px;
            background: orange;
            box-shadow: 0 0 9px 4px orange;
            animation-duration: 0.55s;
        }
        .yellow {
            left: 15px;
            width: 30px;
            height: 30px;
            background: gold;
            box-shadow: 0 0 9px 4px gold;
            animation-duration: 0.45s;
        }
        .white {
            left: 15px;
            bottom: -4px;
            width: 30px;
            height: 30px;
            background: white;
            box-shadow: 0 0 9px 4px white;
            animation-duration: 0.35s;
        }

        .circle {
            position: absolute;
            border-radius: 50%;
        }
        .blue {
            width: 10px;
            height: 10px;
            left: 25px;
            bottom: -4px;
            background: slateblue;
            box-shadow: 0 0 15px 10px slateblue;
        }
        /* esconde a parte de baixo da chama */
        .black {
            width: 60px;
            height: 40px;
            left: 0;
            bottom: -45px;
            background: black;
            box-shadow: 0 0 15px 10px black;
        }

        /* ===== TRONCOS ===== */
        .logs {
            position: absolute;
            left: 150px;   /* centro da fogueira */
            top: 165px;
            z-index: 2;
        }

        .log {
            position: absolute;
            left: 0;
            top: -18px;
            width: 85px;
            height: 36px;
            background: #725442;
            transform-origin: 0 50%;
        }
        /* ponta do tronco */
        .log::after {
            content: '';
            position: absolute;
            right: -18px;
            top: -2px;
            width: 38px;
            height: 40px;
            border-radius: 50%;
            background: #91725c;
            box-sizing: border-box;
            border: 2px solid #725442;
        }

        .log.right  { transform: rotate(8deg);   border-radius: 0 6px 6px 0; }
        .log.left   { transform: rotate(172deg); border-radius: 0 6px 6px 0; }
        .log.front  {
            width: 55px;
            transform: rotate(90deg);
            z-index: 3;
        }
    </style>
</head>
<body>
    <div class="scene">
        <div class="fire">
            <div class="red flame"></div>
            <div class="orange flame"></div>
            <div class="yellow flame"></div>
            <div class="white flame"></div>
            <div class="blue circle"></div>
            <div class="black circle"></div>
        </div>

        <div class="logs">
            <div class="log left"></div>
            <div class="log right"></div>
            <div class="log front"></div>
        </div>
    </div>
</body>
</html>
